name: project_service
description: "Приложение для сервиса ремонта гастрооборудования (клиенты и администраторы)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Подключение к Supabase (авторизация, база данных, storage, realtime)
  supabase_flutter: ^2.5.6

  # Загрузка переменных окружения (SUPABASE_URL, SUPABASE_ANON_KEY) из .env
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.6
  intl: ^0.20.2

  # Запрос к чешскому реестру ARES для автозаполнения заведения по IČO
  http: ^1.2.0

  # Съёмка/выбор фото стикера и оборудования
  image_picker: ^1.1.2

  # Открыть Google Maps по адресу и номер телефона для звонка
  url_launcher: ^6.3.0

  # Хранит выбранный вручную язык интерфейса между запусками приложения
  shared_preferences: ^2.3.2

  # Push-уведомления (Firebase Cloud Messaging) — токен устройства
  # регистрируется в device_tokens, а сама отправка на новое сообщение
  # чата — на стороне сервера, см. supabase/functions/send-push-notification.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # Видео-заставка при запуске приложения (assets/video/splash_intro.mp4)
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Генерация иконок приложения (iOS/Android/web) из одного исходника —
  # см. flutter_launcher_icons.yaml. Нужен только для разработки.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/brand/logo_mark.png
    - assets/brand/logo_mark_white.png
    - assets/video/splash_intro.mp4
    - assets/equipment_categories/
    - assets/equipment_types/
  fonts:
    # Montserrat (Google Fonts, OFL) — шрифт по Brand Book 2026,
    # см. assets/fonts/OFL.txt. Один вариативный файл покрывает весь
    # диапазон начертаний по оси wght — не нужны отдельные файлы на
    # каждый вес.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-VariableFont.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-VariableFont.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-VariableFont.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets_icon_source.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets_icon_source.png"
    background_color: "#02445A"
    theme_color: "#02445A"
