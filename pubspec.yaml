name: project_service
description: "Приложение для сервиса ремонта гастрооборудования (клиенты и администраторы)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Подключение к Supabase (авторизация, база данных, storage, realtime)
  supabase_flutter: ^2.5.6

  # Загрузка переменных окружения (SUPABASE_URL, SUPABASE_ANON_KEY) из .env
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.6
  intl: ^0.20.2

  # Запрос к чешскому реестру ARES для автозаполнения заведения по IČO
  http: ^1.2.0

  # Съёмка/выбор фото стикера и оборудования
  image_picker: ^1.1.2

  # Открыть Google Maps по адресу и номер телефона для звонка
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Генерация иконок приложения (iOS/Android/web) из одного исходника —
  # см. flutter_launcher_icons.yaml. Нужен только для разработки.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/brand/logo_mark.png
  fonts:
    # Golos Text (Google Fonts, OFL) — фирменный шрифт приложения,
    # заменяет системный Roboto/San Francisco. Файлы — статические
    # инстансы вариативного шрифта (Regular/Bold), полный набор
    # кириллицы + латиницы, см. assets/fonts/OFL.txt.
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/GolosText-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets_icon_source.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets_icon_source.png"
    background_color: "#0E5C63"
    theme_color: "#0E5C63"
