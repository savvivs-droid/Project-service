name: project_service
description: "Приложение для сервиса ремонта гастрооборудования (клиенты и администраторы)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Подключение к Supabase (авторизация, база данных, storage, realtime)
  supabase_flutter: ^2.5.6

  # Загрузка переменных окружения (SUPABASE_URL, SUPABASE_ANON_KEY) из .env
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.6
  intl: ^0.19.0

  # Запрос к чешскому реестру ARES для автозаполнения заведения по IČO
  http: ^1.2.0

  # Съёмка/выбор фото стикера и оборудования
  image_picker: ^1.1.2

  # Открыть Google Maps по адресу и номер телефона для звонка
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
