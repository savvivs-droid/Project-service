# Диагностика: выполняет запросы только на чтение (supabase/diagnose.sql)
# и показывает результат в аннотации проверки. Ничего не меняет.
name: DB diagnose

on:
  push:
    branches: [claude/nothing-appeared-dty6dt]
    paths:
      - 'supabase/diagnose.sql'
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: tmdcktpevisansqwgqeq

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Запрос
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          code=$(jq -n --rawfile q supabase/diagnose.sql '{query: $q, read_only: true}' | curl -sS -o result.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @- "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          out=$(jq -c '.' result.json | head -c 6000 | sed 's/%/%25/g')
          echo "::notice title=diagnose $code::$out"
