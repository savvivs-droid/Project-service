# Автоматически деплоит Edge Functions в Supabase при каждом изменении
# кода в supabase/functions/ — не нужно копировать код руками.
#
# Нужен один секрет репозитория (один раз): SUPABASE_ACCESS_TOKEN —
# личный токен Supabase (supabase.com/dashboard/account/tokens),
# добавить в GitHub -> Settings -> Secrets and variables -> Actions.
# Запуск вручную: GitHub -> Actions -> "Deploy Edge Functions" -> Run workflow.
name: Deploy Edge Functions

on:
  push:
    branches: [claude/nothing-appeared-dty6dt]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: tmdcktpevisansqwgqeq

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Проверить токен
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Нет токена::Добавьте секрет SUPABASE_ACCESS_TOKEN в Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      # Supabase CLI из npm: supabase/setup-cli упирался в лимит GitHub API
      # при поиске последней версии.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install -g supabase@latest && supabase --version

      # Функции вызываются вебхуками базы (с ключом service_role), поэтому
      # проверку JWT оставляем включённой — как при создании в Dashboard.
      - name: Деплой
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Функция чата когда-то создана в Dashboard и живёт под адресом
        # smooth-service (на него смотрит вебхук messages) — деплоим тот же
        # код и туда, чтобы не перенастраивать вебхук.
        run: |
          cp -r supabase/functions/send-push-notification supabase/functions/smooth-service
          for fn in send-push-notification smooth-service send-request-notification; do
            supabase functions deploy "$fn" --remote="$SUPABASE_PROJECT_REF" --use-api --yes 2>&1 | tee -a deploy.log
            test "${PIPESTATUS[0]}" -eq 0 || exit 1
          done
        shell: bash

      - name: Показать ошибку деплоя
        if: failure()
        run: |
          test -f deploy.log || exit 0
          tail -n 40 deploy.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
          echo "::error title=Deploy failed::$(cat tail.txt)"
