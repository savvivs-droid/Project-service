# Проверка, что приложение собирается под iOS и Android (без подписи —
# только чтобы ловить ошибки сборки сразу после пуша, без Mac и Flutter
# у себя). Файлы для магазинов эта проверка не публикует.
name: Mobile build check

on:
  push:
    branches: [claude/nothing-appeared-dty6dt]
  workflow_dispatch:

concurrency:
  group: mobile-build-check
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: web-preview
          path: _preview
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cp _preview/assets/.env .env && rm -rf _preview
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: web-preview
          path: _preview
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cp _preview/assets/.env .env && rm -rf _preview
      - run: flutter pub get
      - run: flutter build appbundle --release
